<html>

<head>
    <title>
        Przykład obliczenia V i Pc walca
    </title>
    <script language="JavaScript">
        function Pole_orlinski(a_orl, b_orl) {
            a_orl=parseFloat(a_orl)
            b_orl=parseFloat(b_orl)
            pole_orl=(a_orl*b_orl)
            document.getElementsByName('pole')[0].value = pole_orl.toFixed(2);
            alert("Pole=" + pole_orl.toFixed(2) + " cm^2");
            pokaz1.innerHTML = "P=" + pole_orl.toFixed(2) + "cm^2";

        }
        function Obwod_orlinski(a_orl, b_orl) {
            a_orl=parseFloat(a_orl)
            b_orl=parseFloat(b_orl)
            obwod_orl=(a_orl*2+b_orl*2)
            document.getElementsByName('obw')[0].value = obwod_orl.toFixed(2);
            alert("Obwód=" + obwod_orl.toFixed(2) + " cm");
            pokaz2.innerHTML = "Obw=" + obwod_orl.toFixed(2) + "cm";
        }
    </script>
</head>

<body>
    Pobliczanie V i Pc walca
    <br> <br>
    <form name="formularz" action="..." onsubmit="Pole_orlinski(this.a_dana_orl.value,this.b_dana_orl.value);
    Obwod_orlinski(this.a_dana_orl.value,this.b_dana_orl.value);return false">
        Podaj a=
        <input size="6" name="a_dana_orl">
        Podaj b=
        <input size="6" name="b_dana_orl">
        <br> <br>
        <input TYPE="submit" Value="oblicz">
        <br> <br>
        Pole=
        <input size="6" name="pole">
        Obwód=
        <input size="6" name="obw">
    </form>
    <table>
        <tr id="pokaz1"></tr>
        <tr id="pokaz2"></tr>
    </table>
</body>

</html>
